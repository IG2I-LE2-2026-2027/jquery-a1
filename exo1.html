<script src="jquery.js"></script>

<script>
    function decollage() {
        // Utilisation du symbole $ <=> utilisation de jQuery
        // $("secteur css");
        //  jQuery("selecteur css");

        $("p.exemple")
            .addClass("allume")
            .show("slow");
    }

</script>

<style>
    .allume {
        background-color: yellow;
    }

    .exemple {
        display: none;
    }
</style>

<body>
    <input type="button" onclick="decollage()" value="GO" />
    <p class="exemple"> Paragraphe 1</p>
    <p class=""> Paragraphe 2</p>
    <p class="exemple"> Paragraphe 3</p>
    <div class="exemple">Div 1</div>
    <div class="">Div 2</div>
    <div class="exemple">Div 3</div>
</body>
